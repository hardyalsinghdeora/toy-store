<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#eef2ff"/>
  <text x="50%" y="50%" font-family="Arial" font-size="24" fill="#4f46e5" text-anchor="middle">
    Action Figures
  </text>
  <!-- Simple superhero silhouette -->
  <path d="M200 120 L180 160 L220 160 Z" fill="#4f46e5"/> <!-- head & neck -->
  <rect x="170" y="160" width="60" height="80" fill="#4f46e5"/> <!-- body -->
  <rect x="150" y="160" width="20" height="60" fill="#4f46e5"/> <!-- left arm -->
  <rect x="230" y="160" width="20" height="60" fill="#4f46e5"/> <!-- right arm -->
  <rect x="170" y="240" width="20" height="60" fill="#4f46e5"/> <!-- left leg -->
  <rect x="210" y="240" width="20" height="60" fill="#4f46e5"/> <!-- right leg -->
  <!-- Cape -->
  <path d="M170 160 Q200 220 230 160" fill="none" stroke="#4f46e5" stroke-width="4"/>
</svg> 