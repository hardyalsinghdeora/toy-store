<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#eff6ff"/>
  <text x="50%" y="50%" font-family="Arial" font-size="24" fill="#2563eb" text-anchor="middle">
    Board Games
  </text>
  <!-- Chess/checkers board -->
  <g transform="translate(150,150)">
    <rect width="100" height="100" fill="#2563eb"/>
    <g fill="#eff6ff">
      <rect x="0" y="0" width="25" height="25"/>
      <rect x="50" y="0" width="25" height="25"/>
      <rect x="25" y="25" width="25" height="25"/>
      <rect x="75" y="25" width="25" height="25"/>
      <rect x="0" y="50" width="25" height="25"/>
      <rect x="50" y="50" width="25" height="25"/>
      <rect x="25" y="75" width="25" height="25"/>
      <rect x="75" y="75" width="25" height="25"/>
    </g>
  </g>
  <!-- Dice -->
  <rect x="270" y="170" width="30" height="30" fill="#2563eb" rx="5"/>
  <circle cx="280" cy="180" r="3" fill="#eff6ff"/>
  <circle cx="290" cy="190" r="3" fill="#eff6ff"/>
</svg> 